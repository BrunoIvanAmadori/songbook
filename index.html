<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />

  <title>Cancionero</title>

  <style>
    :root {
      --bg: #111111;
      --panel: #1b1b1b;
      --panel-soft: #242424;
      --text: #f4f4f4;
      --muted: #a8a8a8;
      --accent: #1db954;
      --border: #333333;
      --warning-bg: #2a220f;
      --warning-border: #6a541b;
      --warning-text: #ffd98a;
      --error: #ff8f8f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(17, 17, 17, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 700;
    }

    .top-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #search {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    #refreshButton {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--text);
      padding: 12px 14px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    #refreshButton:hover {
      background: var(--panel-soft);
    }

    main {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: calc(100vh - 88px);
    }

    aside {
      border-right: 1px solid var(--border);
      background: var(--panel);
      padding: 12px;
      overflow-y: auto;
    }

    .song-button {
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--text);
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .song-button:hover,
    .song-button.active {
      background: var(--panel-soft);
      border-color: var(--border);
    }

    .song-title {
      display: block;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .song-artist {
      display: block;
      font-size: 13px;
      color: var(--muted);
    }

    article {
      padding: 22px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .song-header {
      margin-bottom: 18px;
    }

    .song-header h2 {
      margin: 0 0 4px;
      font-size: 30px;
      line-height: 1.1;
    }

    .song-meta {
      color: var(--muted);
      font-size: 15px;
    }

    .reference-player {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin: 18px 0 24px;
    }

    .reference-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 14px;
      color: var(--muted);
    }

    .reference-label strong {
      color: var(--text);
      font-size: 15px;
    }

    .spotify-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
    }

    .spotify-link:hover {
      text-decoration: underline;
    }

    .spotify-frame {
      width: 100%;
      height: 152px;
      border: 0;
      border-radius: 12px;
      display: block;
    }

    .song-sheet {
      font-family: "Courier New", Courier, monospace;
      font-size: 16px;
      white-space: pre-wrap;
      background: #0d0d0d;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      overflow-x: auto;
    }

    .state-message,
    .notice {
      color: var(--muted);
      font-size: 16px;
      padding: 32px 0;
    }

    .state-message.error {
      color: var(--error);
    }

    .cache-notice {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning-text);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .spotify-offline-note {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }

    @media (max-width: 760px) {
      main {
        display: block;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--border);
        max-height: 260px;
      }

      article {
        padding: 16px;
      }

      .song-header h2 {
        font-size: 24px;
      }

      .song-sheet {
        font-size: 14px;
        padding: 14px;
      }

      .spotify-frame {
        height: 152px;
      }

      .top-row {
        align-items: stretch;
      }

      #refreshButton {
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Cancionero</h1>
    <div class="top-row">
      <input id="search" type="search" placeholder="Buscar canción o artista..." />
      <button id="refreshButton" type="button">Actualizar</button>
    </div>
  </header>

  <main>
    <aside id="songList"></aside>

    <article id="songView">
      <div class="state-message">Cargando canciones...</div>
    </article>
  </main>

  <script>
    const SHEET_ID = "PEGAR_ID_DEL_GOOGLE_SHEET";
    const SHEET_NAME = "Canciones";
    const CACHE_KEY = "cancionero_songs_cache_v1";

    const sheetUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

    let songs = [];
    let activeSongIndex = 0;
    let currentDataSource = "fresh";
    let cachedAt = "";

    const songListEl = document.getElementById("songList");
    const songViewEl = document.getElementById("songView");
    const searchEl = document.getElementById("search");
    const refreshButtonEl = document.getElementById("refreshButton");

    init();
    registerServiceWorker();

    async function init() {
      const cachedPayload = loadSongsFromCache();

      if (cachedPayload.songs.length) {
        songs = cachedPayload.songs;
        cachedAt = cachedPayload.savedAt;
        currentDataSource = "cache-syncing";
        renderSongList(getFilteredSongs());
        renderSong(0);
      } else {
        renderState("Cargando canciones...");
      }

      await refreshSongs({ silentWhenCacheExists: Boolean(cachedPayload.songs.length) });
    }

    async function refreshSongs(options = {}) {
      const { silentWhenCacheExists = false } = options;

      try {
        if (!silentWhenCacheExists) {
          renderState("Actualizando canciones...");
        }

        const freshSongs = await loadSongsFromGoogleSheets();

        if (!freshSongs.length) {
          if (!songs.length) {
            renderState("No hay canciones cargadas en la hoja.");
          }
          return;
        }

        songs = freshSongs;
        cachedAt = new Date().toISOString();
        currentDataSource = "fresh";
        activeSongIndex = Math.min(activeSongIndex, songs.length - 1);

        saveSongsToCache(songs, cachedAt);
        renderSongList(getFilteredSongs());
        renderSong(activeSongIndex);
      } catch (error) {
        console.error(error);

        const cachedPayload = loadSongsFromCache();

        if (cachedPayload.songs.length) {
          songs = cachedPayload.songs;
          cachedAt = cachedPayload.savedAt;
          currentDataSource = "cache-offline";
          activeSongIndex = Math.min(activeSongIndex, songs.length - 1);
          renderSongList(getFilteredSongs());
          renderSong(activeSongIndex);
          return;
        }

        renderState(
          "No se pudieron cargar las canciones desde Google Sheets y no hay una copia offline guardada. Abrí el Cancionero una vez con conexión para crear la cache local.",
          true
        );
      }
    }

    async function loadSongsFromGoogleSheets() {
      const response = await fetch(sheetUrl, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(`Google Sheets respondió con estado ${response.status}`);
      }

      const csvText = await response.text();
      const rows = parseCsv(csvText);

      if (rows.length < 2) {
        return [];
      }

      const headers = rows[0].map(normalizeHeader);

      return rows
        .slice(1)
        .map((row) => rowToSong(headers, row))
        .filter((song) => song.title && song.lyrics);
    }

    function rowToSong(headers, row) {
      const data = {};

      headers.forEach((header, index) => {
        data[header] = row[index] ? row[index].trim() : "";
      });

      return {
        title: data.title || data.titulo || data.cancion || "",
        artist: data.artist || data.artista || "",
        key: data.key || data.tono || "",
        spotifyUrl: data.spotifyurl || data.spotify || data.spotifylink || "",
        lyrics: data.lyrics || data.letra || data.acordes || ""
      };
    }

    function normalizeHeader(header) {
      return String(header || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, "")
        .replace(/_/g, "");
    }

    function saveSongsToCache(songsToSave, savedAt) {
      const payload = {
        savedAt,
        songs: songsToSave
      };

      localStorage.setItem(CACHE_KEY, JSON.stringify(payload));
    }

    function loadSongsFromCache() {
      try {
        const rawPayload = localStorage.getItem(CACHE_KEY);

        if (!rawPayload) {
          return { savedAt: "", songs: [] };
        }

        const payload = JSON.parse(rawPayload);

        if (!payload || !Array.isArray(payload.songs)) {
          return { savedAt: "", songs: [] };
        }

        return {
          savedAt: payload.savedAt || "",
          songs: payload.songs
        };
      } catch (error) {
        console.warn("No se pudo leer la cache local:", error);
        return { savedAt: "", songs: [] };
      }
    }

    function renderSongList(list) {
      songListEl.innerHTML = "";

      if (!list.length) {
        songListEl.innerHTML = `<div class="notice">No hay canciones que coincidan con la búsqueda.</div>`;
        return;
      }

      list.forEach((song) => {
        const index = songs.indexOf(song);
        const button = document.createElement("button");
        button.className = "song-button";
        button.type = "button";

        if (index === activeSongIndex) {
          button.classList.add("active");
        }

        button.innerHTML = `
          <span class="song-title">${escapeHtml(song.title)}</span>
          <span class="song-artist">${escapeHtml(song.artist || "Sin artista")}</span>
        `;

        button.addEventListener("click", () => {
          activeSongIndex = index;
          renderSong(activeSongIndex);
          renderSongList(getFilteredSongs());
        });

        songListEl.appendChild(button);
      });
    }

    function renderSong(index) {
      const song = songs[index];

      if (!song) {
        renderState("Canción no encontrada.");
        return;
      }

      const spotifyEmbedUrl = getSpotifyEmbedUrl(song.spotifyUrl);
      const cacheNotice = getCacheNoticeHtml();
      const shouldRenderSpotifyIframe = spotifyEmbedUrl && currentDataSource !== "cache-offline";

      songViewEl.innerHTML = `
        ${cacheNotice}

        <section class="song-header">
          <h2>${escapeHtml(song.title)}</h2>
          <div class="song-meta">
            ${escapeHtml(song.artist || "Sin artista")}
            ${song.key ? ` · Tono: ${escapeHtml(song.key)}` : ""}
          </div>
        </section>

        ${spotifyEmbedUrl ? `
          <section class="reference-player">
            <div class="reference-label">
              <strong>Referencia</strong>
              <a class="spotify-link" href="${escapeAttribute(song.spotifyUrl)}" target="_blank" rel="noopener noreferrer">
                Abrir en Spotify
              </a>
            </div>

            ${shouldRenderSpotifyIframe ? `
              <iframe
                class="spotify-frame"
                src="${escapeAttribute(spotifyEmbedUrl)}"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy">
              </iframe>
            ` : `
              <p class="spotify-offline-note">El reproductor de Spotify requiere conexión.</p>
            `}
          </section>
        ` : ""}

        <pre class="song-sheet">${escapeHtml(song.lyrics)}</pre>
      `;
    }

    function getCacheNoticeHtml() {
      if (currentDataSource === "fresh") {
        return "";
      }

      const cachedAtText = cachedAt ? ` Última sincronización: ${formatDate(cachedAt)}.` : "";

      if (currentDataSource === "cache-syncing") {
        return `<div class="cache-notice">Mostrando copia local mientras se sincroniza con Google Sheets.${cachedAtText}</div>`;
      }

      return `<div class="cache-notice">Sin conexión o Google Sheets no disponible. Estás viendo la última copia guardada.${cachedAtText}</div>`;
    }

    function renderState(message, isError = false) {
      songListEl.innerHTML = "";
      songViewEl.innerHTML = `
        <div class="state-message ${isError ? "error" : ""}">
          ${escapeHtml(message)}
        </div>
      `;
    }

    function getFilteredSongs() {
      const query = searchEl.value.trim().toLowerCase();

      if (!query) {
        return songs;
      }

      return songs.filter((song) => {
        return (
          song.title.toLowerCase().includes(query) ||
          song.artist.toLowerCase().includes(query)
        );
      });
    }

    searchEl.addEventListener("input", () => {
      renderSongList(getFilteredSongs());
    });

    refreshButtonEl.addEventListener("click", () => {
      refreshSongs();
    });

    function getSpotifyEmbedUrl(url) {
      if (!url) {
        return "";
      }

      try {
        const parsedUrl = new URL(url);
        const pathParts = parsedUrl.pathname.split("/").filter(Boolean);

        const type = pathParts[0];
        const id = pathParts[1];
        const allowedTypes = ["track", "album", "playlist", "artist", "episode", "show"];

        if (!allowedTypes.includes(type) || !id) {
          return "";
        }

        return `https://open.spotify.com/embed/${type}/${id}`;
      } catch {
        return "";
      }
    }

    function parseCsv(csvText) {
      const rows = [];
      let row = [];
      let cell = "";
      let insideQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];

        if (char === '"' && insideQuotes && nextChar === '"') {
          cell += '"';
          i++;
          continue;
        }

        if (char === '"') {
          insideQuotes = !insideQuotes;
          continue;
        }

        if (char === "," && !insideQuotes) {
          row.push(cell);
          cell = "";
          continue;
        }

        if ((char === "\n" || char === "\r") && !insideQuotes) {
          if (char === "\r" && nextChar === "\n") {
            i++;
          }

          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
          continue;
        }

        cell += char;
      }

      if (cell || row.length) {
        row.push(cell);
        rows.push(row);
      }

      return rows.filter((csvRow) => {
        return csvRow.some((value) => String(value || "").trim() !== "");
      });
    }

    function formatDate(value) {
      try {
        return new Date(value).toLocaleString("es-AR", {
          dateStyle: "short",
          timeStyle: "short"
        });
      } catch {
        return value;
      }
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    function registerServiceWorker() {
      if (!("serviceWorker" in navigator)) {
        return;
      }

      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch((error) => {
          console.warn("No se pudo registrar el service worker:", error);
        });
      });
    }
  </script>
</body>
</html>
