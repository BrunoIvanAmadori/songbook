<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cancionero Transpositor</title>
  <style>
    :root{
      --bg:#000000;
      --bg-glow:#121212;
      --panel:#121212;
      --panel-soft:#181818;
      --panel-raise:#202020;
      --paper:#101010;
      --ink:#ffffff;
      --muted:#b3b3b3;
      --line:#2a2a2a;
      --accent:#1ed760;
      --accent-strong:#1fdf64;
      --accent-soft:#1db954;
      --accent-wash:rgba(30,215,96,.16);
      --chord:#1ed760;
      --font-size:15px;
      --shadow:0 22px 50px rgba(0,0,0,.38);
      --radius:22px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:
        radial-gradient(circle at top left, rgba(30,215,96,.18), transparent 26%),
        radial-gradient(circle at top right, rgba(40,40,40,.9), transparent 24%),
        linear-gradient(180deg, #0a0a0a 0%, #000000 100%);
      color:var(--ink);
      font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
      min-height:100vh;
    }
    header{
      padding:14px 14px 8px;
      background:linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,.72));
      backdrop-filter:blur(16px);
    }
    .bar{
      max-width:1180px;
      margin:0 auto;
      display:grid;
      gap:14px;
      padding:16px 18px;
      border:0;
      border-radius:0;
      background:rgba(18,18,18,.92);
      box-shadow:none;
    }
    h1{
      margin:0;
      font-size:28px;
      line-height:1;
      letter-spacing:-.04em;
      font-weight:800;
    }
    .app-subtitle{
      margin:4px 0 0;
      color:var(--muted);
      font-size:13px;
      letter-spacing:.01em;
    }
    .brand{display:grid;gap:4px;align-content:start}
    .controls{display:grid;grid-template-columns:1fr;gap:10px}
    .config-row{
      display:grid;
      grid-template-columns:minmax(92px, 1.1fr) minmax(132px, 1fr) minmax(108px, .9fr);
      gap:8px;
      align-items:end;
    }
    .control-compact label{margin-bottom:5px}
    .wide{grid-column:1/-1}
    label{
      display:block;
      margin:0 0 6px;
      font-size:11px;
      font-weight:700;
      color:#8f8f8f;
      text-transform:uppercase;
      letter-spacing:.1em;
    }
    select,button{
      width:100%;
      min-height:42px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:999px;
      background:#242424;
      color:var(--ink);
      padding:8px 12px;
      font-size:13px;
      transition:transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }
    select:focus,button:focus{
      outline:none;
      border-color:rgba(30,215,96,.68);
      box-shadow:0 0 0 3px rgba(30,215,96,.16);
    }
    button{
      font-weight:700;
      background:#2a2a2a;
      border-color:rgba(255,255,255,.08);
      cursor:pointer;
    }
    button:hover{
      transform:translateY(-1px);
      background:#313131;
      border-color:rgba(255,255,255,.14);
    }
    #resetBtn,
    #fontUp{
      background:var(--accent-soft);
      color:#08120b;
      border-color:transparent;
    }
    #resetBtn:hover,
    #fontUp:hover{
      background:var(--accent-strong);
    }
    .stepper{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
    .stepper.two{grid-template-columns:1fr 1fr}
    .stepper button{min-height:38px;padding:8px 0}
    main{
      max-width:1180px;
      margin:0 auto;
      padding:6px 14px 28px;
    }
    .sheet{
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(180deg, rgba(34,34,34,.92) 0%, rgba(18,18,18,.98) 180px, rgba(18,18,18,1) 100%);
      border:1px solid rgba(255,255,255,.06);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:18px 16px 30px;
    }
    .sheet::before{
      content:"";
      position:absolute;
      inset:0 0 auto;
      height:220px;
      background:
        radial-gradient(circle at top left, rgba(30,215,96,.32), transparent 34%),
        linear-gradient(180deg, rgba(42,42,42,.12), transparent 100%);
      pointer-events:none;
    }
    .song-head{
      position:relative;
      z-index:1;
      display:grid;
      gap:12px;
      padding:18px 0 18px;
      margin-bottom:18px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .song-title{
      margin:0;
      font-size:clamp(32px, 5vw, 64px);
      line-height:.96;
      letter-spacing:-.05em;
      font-weight:900;
      max-width:12ch;
    }
    .meta{display:flex;gap:10px;flex-wrap:wrap}
    .badge{
      display:inline-flex;
      align-items:center;
      min-height:34px;
      padding:6px 12px;
      border:1px solid rgba(255,255,255,.07);
      border-radius:999px;
      background:rgba(255,255,255,.06);
      font-size:13px;
      color:#f3f3f3;
      backdrop-filter:blur(10px);
    }
    .reference-player{
      position:relative;
      z-index:1;
      margin:0 0 24px;
      border:1px solid rgba(255,255,255,.06);
      border-radius:20px;
      background:rgba(255,255,255,.04);
      overflow:hidden;
    }
    .reference-toggle{
      list-style:none;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px;
      cursor:pointer;
    }
    .reference-toggle::-webkit-details-marker{display:none}
    .reference-toggle::marker{content:""}
    .reference-summary{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .reference-icon{
      width:28px;
      height:20px;
      flex:0 0 28px;
      display:block;
    }
    .reference-summary strong{
      font-size:15px;
      color:var(--ink);
    }
    .reference-actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-shrink:0;
    }
    .reference-chevron{
      color:var(--muted);
      font-size:16px;
      transition:transform .18s ease;
    }
    .reference-player[open] .reference-chevron{transform:rotate(180deg)}
    .reference-body{
      padding:0 14px 14px;
      border:1px solid rgba(255,255,255,.06);
    }
    .reference-link{
      color:#ffffff;
      text-decoration:none;
      font-size:13px;
      white-space:nowrap;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
    }
    .reference-link:hover{background:rgba(255,255,255,.14)}
    .reference-frame{
      display:block;
      width:100%;
      aspect-ratio:16/9;
      min-height:220px;
      border:0;
      border-radius:16px;
    }

    #songBody{
      position:relative;
      z-index:1;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
      font-size:var(--font-size);
      line-height:1.2;
      letter-spacing:0;
      font-variant-ligatures:none;
      text-rendering:optimizeSpeed;
      color:#f6f6f6;
    }
    .section{
      margin:24px 0 10px;
      padding-top:14px;
      border-top:1px solid rgba(255,255,255,.08);
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      font-size:12px;
      font-weight:800;
      color:#d7d7d7;
      text-transform:uppercase;letter-spacing:.08em;
    }
    .comment{
      margin:6px 0 8px;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      font-size:12px;
      font-style:italic;
      color:#8f8f8f;
    }
    .empty{height:12px}
    .pair{
      margin:3px 0 9px;
      padding:6px 10px;
      border-radius:12px;
      background:linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.01));
    }
    .pair .chords,
    .pair .lyrics,
    .chord-row,
    .plain-row{
      white-space:pre;
      overflow:hidden;
      font-family:inherit;
      max-width:100%;
    }
    .pair .chords,
    .chord-row{
      color:var(--chord);
      font-weight:800;
      min-height:1.08em;
      text-shadow:0 0 14px rgba(30,215,96,.14);
    }
    .pair .lyrics,
    .plain-row{color:var(--ink)}
    .plain-row{
      padding:2px 0;
      color:#efefef;
    }
    .note{
      position:relative;
      z-index:1;
      margin-top:18px;
      padding:12px 14px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      background:rgba(255,255,255,.045);
      color:var(--muted);
      font-size:12px;
      line-height:1.45;
    }
    @media (min-width:700px){
      .wide{grid-column:auto}
      .sheet{padding:26px 28px 32px}
    }
    @media (min-width:980px){
      .bar{grid-template-columns:minmax(280px, 1.3fr) minmax(520px, 2fr);align-items:end}
      .controls{align-self:stretch}
    }
    @media print{
      header,.note,.reference-player{display:none}
      body{background:white}
      main{padding:0;max-width:none}
      .sheet{border:0;box-shadow:none;border-radius:0}
    }
  </style>
</head>

  <header>
    <div class="bar">
      <div class="brand">
        <h1>Cancionero transpositor</h1>
        <p class="app-subtitle">Modo cancionero en vivo, con transposición instantánea y estética tipo streaming.</p>
      </div>
      <div class="controls">
        <div class="wide">
          <label for="songSelect">Canción</label>
          <select id="songSelect"></select>
        </div>
        <div>
          <label for="keySelect">Tono</label>
          <select id="keySelect"></select>
        </div>
        <div>

          <div class="stepper">
            <button id="downBtn" type="button">−1</button>
            <button id="resetBtn" type="button">0</button>
            <button id="upBtn" type="button">+1</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <article class="sheet" id="sheet">
      <div class="song-head">
        <h2 class="song-title" id="songTitle"></h2>
        <div class="meta">
          <span class="badge" id="originalKey"></span>
          <span class="badge" id="currentKey"></span>
          <span class="badge" id="semitones"></span>
        </div>
      </div>
      <div id="songReference"></div>
      <div id="songBody"></div>
      <div class="footer-actions">
        <button id="fontDown" type="button">Letra −</button>
        <button id="fontUp" type="button">Letra +</button>
      </div>
      <div class="note">Cargando canciones desde Google Sheet central... Si la hoja todavía no está publicada, se usa una copia local de respaldo.</div>
    </article>
  </main>

const SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const NOTE_TO_INDEX = {
  'C':0,'B#':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'Fb':4,
  'E#':5,'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11,'Cb':11
};
const MAJOR_KEYS = SHARP.concat(FLAT.filter(k => !SHARP.includes(k)));
const MINOR_KEYS = MAJOR_KEYS.map(k => k + 'm');

function parseKey(key){ const m = key.match(/^([A-G](?:#|b)?)(m?)$/); return {root:m?m[1]:'C', minor:!!(m&&m[2])}; }
function keyIndex(key){ return NOTE_TO_INDEX[parseKey(key).root]; }
function transposeRoot(root, offset, preferFlats){
  const idx = NOTE_TO_INDEX[root]; if(idx === undefined) return root;
  const scale = preferFlats ? FLAT : SHARP;
  return scale[(idx + offset + 1200) % 12];
}
function transposeChord(chord, offset, preferFlats){
  if(!chord || !chord.trim()) return chord;
  return chord.replace(/([A-G](?:#|b)?)/g, (m, root) => transposeRoot(root, offset, preferFlats));
}
function normalizeOffset(n){ let v=((n%12)+12)%12; if(v>6) v-=12; return v; }
function targetKeyName(song, offset, preferFlats){ const pk=parseKey(song.key); return transposeRoot(pk.root, offset, preferFlats)+(pk.minor?'m':''); }

const EMBEDDED_SONGS = songs.map(song => ({ ...song }));
let cachedSongsMeta = null;
let currentSongsSource = 'embedded';

function loadSongsFromGoogleSheet() {
  return new Promise((resolve, reject) => {
    const cb = '__cancionero_cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&tqx=out:json;responseHandler:${cb}`;
    const script = document.createElement('script');
    let done = false;
    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('No se pudo leer la Google Sheet. Publicala o compartila como visible para lectura.'));
    }, 7000);
    function cleanup() {
      clearTimeout(timer);
      try { delete window[cb]; } catch(e) { window[cb] = undefined; }
      script.remove();
    }
    window[cb] = (res) => {
      if (done) return;
      done = true;
      cleanup();
      try { resolve(parseGvizSongs(res)); }
      catch(e) { reject(e); }
    };
    script.onerror = () => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('Error cargando la fuente de canciones.'));
    };
    script.src = src;
    document.head.appendChild(script);
  });
}

function parseGvizSongs(res) {
  if (!res || !res.table || !res.table.cols || !res.table.rows) return [];
  const headers = res.table.cols.map((c, i) => String(c.label || c.id || ('col'+i)).trim().toLowerCase());
  const index = name => headers.indexOf(name);
  const idx = { id:index('id'), title:index('title'), key:index('key'), body:index('body'), visible:index('visible'), notes:index('notes'), youtubeUrl:index('youtubeurl') };
  if (idx.title < 0 || idx.key < 0 || idx.body < 0) return [];
  return res.table.rows.map((r, n) => {
    const cells = r.c || [];
    const get = i => i >= 0 && cells[i] ? (cells[i].v ?? '') : '';
    const title = String(get(idx.title)).trim();
    const key = String(get(idx.key)).trim();
    const body = String(get(idx.body)).replace(/\r\n/g, '\n').trim();
    const youtubeUrl = String(get(idx.youtubeUrl)).trim();
    const visible = String(get(idx.visible) || 'TRUE').toUpperCase();
    if (!title || !key || !body || visible === 'FALSE' || visible === 'NO' || visible === '0') return null;
    let id = String(get(idx.id) || title).trim().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    if (!id) id = 'song-' + (n+1);
    return { id, title, key, body, youtubeUrl };
  }).filter(Boolean);
}

function saveSongsCache(remoteSongs) {
  try {
    const payload = {
      savedAt: new Date().toISOString(),
      songs: remoteSongs
    };
    localStorage.setItem(SONGS_CACHE_KEY, JSON.stringify(payload));
    cachedSongsMeta = payload;
  } catch (err) {
    console.warn('No pude guardar la copia local de canciones.', err);
  }
}

function loadSongsCache() {
  try {
    const raw = localStorage.getItem(SONGS_CACHE_KEY);
    if (!raw) return null;
    const payload = JSON.parse(raw);
    if (!payload || !Array.isArray(payload.songs)) return null;
    const validSongs = payload.songs.filter(song => (
      song &&
      typeof song.id === 'string' &&
      typeof song.title === 'string' &&
      typeof song.key === 'string' &&
      typeof song.body === 'string' &&
      song.title.trim() &&
      song.key.trim() &&
      song.body.trim()
    )).map(song => ({
      id: song.id,
      title: song.title,
      key: song.key,
      body: song.body,
      youtubeUrl: typeof song.youtubeUrl === 'string' ? song.youtubeUrl.trim() : ''
    }));
    if (!validSongs.length) return null;
    return {
      savedAt: payload.savedAt || '',
      songs: validSongs
    };
  } catch (err) {
    console.warn('No pude leer la copia local de canciones.', err);
    return null;
  }
}

function formatCachedAt(savedAt) {
  if (!savedAt) return '';
  try {
    return new Date(savedAt).toLocaleString('es-AR', {
      dateStyle: 'short',
      timeStyle: 'short'
    });
  } catch (err) {
    return savedAt;
  }
}

function getMaxCols(){
  const sheetWidth = el.sheet.clientWidth - 28;
  const charWidth = state.fontSize * 0.61;
  return Math.max(26, Math.min(48, Math.floor(sheetWidth / charWidth)));
}
function parseBracketLine(line){
  const regex = /\[([^\]]+)\]/g;
  let lyric = '';
  let placements = [];
  let lastIndex = 0;
  let m;
  while((m = regex.exec(line))){
    lyric += line.slice(lastIndex, m.index);
    placements.push({ pos: lyric.length, chord: m[1] });
    lastIndex = regex.lastIndex;
  }
  lyric += line.slice(lastIndex);
  return { lyric, placements };
}
function wrapLyric(lyric, maxCols){
  if(lyric.length <= maxCols) return [{start:0,end:lyric.length}];
  const chunks=[];
  let start=0;
  while(start < lyric.length){
    if(lyric.length - start <= maxCols){
      chunks.push({start,end:lyric.length});
      break;
    }
    let end = start + maxCols;
    let breakAt = lyric.lastIndexOf(' ', end);
    if(breakAt <= start + 8){
      breakAt = lyric.indexOf(' ', end);
      if(breakAt === -1) breakAt = Math.min(lyric.length, end);
    }
    chunks.push({start, end: breakAt});
    start = breakAt;
    while(start < lyric.length && lyric[start] === ' ') start++;
  }
  return chunks;
}
function buildChordLine(width, placements, start, end, offset, preferFlats){
  const arr = Array(width).fill(' ');
  placements.forEach(p => {
    if(p.pos < start || p.pos >= end) return;
    const chord = transposeChord(p.chord, offset, preferFlats);
    const local = p.pos - start;
    for(let i=0;i<chord.length && local+i < arr.length;i++) arr[local+i] = chord[i];
  });
  return arr.join('').replace(/\s+$/,'');
}
function renderPair(chords, lyrics){
  const wrap = document.createElement('div'); wrap.className = 'pair';
  const ch = document.createElement('div'); ch.className = 'chords'; ch.textContent = chords || ' ';
  const ly = document.createElement('div'); ly.className = 'lyrics'; ly.textContent = lyrics;
  wrap.appendChild(ch); wrap.appendChild(ly); return wrap;
}
function renderChordOnly(line, offset, preferFlats){
  const content = line.replace(/^\{chords:\s*|\}$/g,'').trim();
  const parts = content.split(/\s+/).filter(Boolean).map(c => transposeChord(c, offset, preferFlats));
  const div = document.createElement('div'); div.className = 'chord-row'; div.textContent = parts.join('  '); return div;
}
function renderPlainWrapped(text){
  const maxCols = getMaxCols();
  const chunks = wrapLyric(text, maxCols);
  const frag = document.createDocumentFragment();
  chunks.forEach(({start,end}) => {
    const div = document.createElement('div'); div.className = 'plain-row'; div.textContent = text.slice(start,end).trimEnd(); frag.appendChild(div);
  });
  return frag;
}
function renderLine(line, offset, preferFlats){
  if(!line.trim()){ const div=document.createElement('div'); div.className='empty'; return div; }
  const section = line.match(/^\{section:\s*(.*?)\}$/); if(section){ const div=document.createElement('div'); div.className='section'; div.textContent=section[1]; return div; }
  const comment = line.match(/^\{comment:\s*(.*?)\}$/); if(comment){ const div=document.createElement('div'); div.className='comment'; div.textContent=comment[1]; return div; }
  if(/^\{chords:/.test(line)) return renderChordOnly(line, offset, preferFlats);
  if(!line.includes('[')){
    const box = document.createElement('div');
    box.appendChild(renderPlainWrapped(line));
    return box;
  }
  const { lyric, placements } = parseBracketLine(line);
  const maxCols = getMaxCols();
  const chunks = wrapLyric(lyric, maxCols);
  const box = document.createElement('div');
  chunks.forEach(({start,end}) => {
    const lyricChunk = lyric.slice(start,end).trimEnd();
    const width = lyricChunk.length;
    const chordLine = buildChordLine(width, placements, start, end, offset, preferFlats);
    box.appendChild(renderPair(chordLine, lyricChunk));
  });
  return box;
}
function getYouTubeEmbedUrl(url) {
  if (!url) return '';
  try {
    const parsedUrl = new URL(url);
    const host = parsedUrl.hostname.replace(/^www\./, '').toLowerCase();
    let videoId = '';

    if (host === 'youtu.be') {
      videoId = parsedUrl.pathname.split('/').filter(Boolean)[0] || '';
    } else if (host === 'youtube.com' || host === 'm.youtube.com') {
      if (parsedUrl.pathname === '/watch') {
        videoId = parsedUrl.searchParams.get('v') || '';
      } else if (parsedUrl.pathname.startsWith('/embed/')) {
        videoId = parsedUrl.pathname.split('/').filter(Boolean)[1] || '';
      } else if (parsedUrl.pathname.startsWith('/shorts/')) {
        videoId = parsedUrl.pathname.split('/').filter(Boolean)[1] || '';
      }
    }

    if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) return '';
    return `https://www.youtube.com/embed/${videoId}`;
  } catch {
    return '';
  }
}
function renderYouTubeReference(song) {
  const youtubeUrl = typeof song.youtubeUrl === 'string' ? song.youtubeUrl.trim() : '';
  const youtubeEmbedUrl = getYouTubeEmbedUrl(youtubeUrl);
  el.reference.innerHTML = '';
  if (!youtubeEmbedUrl) return;
  const youtubeIcon = '<svg class="reference-icon" viewBox="0 0 28 20" aria-hidden="true"><rect x="0" y="0" width="28" height="20" rx="6" fill="#FF0033"></rect><path d="M11 6.1L18 10L11 13.9V6.1Z" fill="#FFFFFF"></path></svg>';

  const section = document.createElement('details');
  section.className = 'reference-player';

  const summary = document.createElement('summary');
  summary.className = 'reference-toggle';

  const summaryText = document.createElement('div');
  summaryText.className = 'reference-summary';

  const titleWrap = document.createElement('div');
  const title = document.createElement('strong');
  title.textContent = 'Referencia de YouTube';
  titleWrap.appendChild(title);

  summaryText.insertAdjacentHTML('beforeend', youtubeIcon);
  summaryText.appendChild(titleWrap);

  const actions = document.createElement('div');
  actions.className = 'reference-actions';

  const link = document.createElement('a');
  link.className = 'reference-link';
  link.href = youtubeUrl;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.textContent = 'Abrir';
  link.addEventListener('click', e => e.stopPropagation());

  const chevron = document.createElement('span');
  chevron.className = 'reference-chevron';
  chevron.textContent = '▾';

  actions.appendChild(link);
  actions.appendChild(chevron);
  summary.appendChild(summaryText);
  summary.appendChild(actions);

  const body = document.createElement('div');
  body.className = 'reference-body';

  const iframe = document.createElement('iframe');
  iframe.className = 'reference-frame';
  iframe.src = youtubeEmbedUrl;
  iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  iframe.loading = 'lazy';
  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
  iframe.allowFullscreen = true;

  body.appendChild(iframe);
  section.appendChild(summary);
  section.appendChild(body);
  el.reference.appendChild(section);
}
function render(){
  const song = currentSong();
  const preferFlats = song.key.includes('b') || targetKeyName(song, state.offset, false).includes('b');
  const currentKey = targetKeyName(song, state.offset, preferFlats);
  document.documentElement.style.setProperty('--font-size', state.fontSize + 'px');
  populateKeys();
  el.songSelect.value = song.id;
  el.songTitle.textContent = song.title;
  el.originalKey.textContent = 'Original: ' + song.key;
  el.currentKey.textContent = 'Actual: ' + currentKey;
  const off = normalizeOffset(state.offset);
  el.semitones.textContent = off === 0 ? 'Sin transponer' : (off > 0 ? `+${off} semitonos` : `${off} semitonos`);
  renderYouTubeReference(song);
  el.body.innerHTML = '';
  song.body.split('\n').forEach(line => el.body.appendChild(renderLine(line, state.offset, preferFlats)));
  save();
}

loadSongsFromGoogleSheet()
  .then(remoteSongs => {

      if (!songs.find(s => s.id === state.songId)) { state.songId = songs[0].id; state.offset = 0; }
      populateSongs();
      render();
      setSourceStatus('Fuente: Google Sheet central cargada correctamente. Tambien guarde una copia local para usarla sin conexion si hace falta.', true);
    } else {
      if (currentSongsSource === 'cache') {
        const cachedAt = formatCachedAt(cachedSongsMeta && cachedSongsMeta.savedAt);
        setSourceStatus(`No encontre canciones validas en la Google Sheet. Sigo usando la copia local guardada.${cachedAt ? ` Ultima sincronizacion: ${cachedAt}.` : ''}`, false);
        return;
      }
      songs = EMBEDDED_SONGS.map(song => ({ ...song }));
      currentSongsSource = 'embedded';
      if (!songs.find(s => s.id === state.songId)) { state.songId = songs[0].id; state.offset = 0; }
      populateSongs();
      render();
      setSourceStatus('No encontré canciones válidas en la Google Sheet. Estoy usando la copia local incluida en este archivo.', false);
    }
  })
  .catch(err => {
    console.warn(err);
    if (currentSongsSource === 'cache') {
      const cachedAt = formatCachedAt(cachedSongsMeta && cachedSongsMeta.savedAt);
      setSourceStatus(`No pude leer la Google Sheet central. Estoy usando la copia local guardada.${cachedAt ? ` Ultima sincronizacion: ${cachedAt}.` : ''}`, false);
      return;
    }
    songs = EMBEDDED_SONGS.map(song => ({ ...song }));
    currentSongsSource = 'embedded';
    if (!songs.find(s => s.id === state.songId)) { state.songId = songs[0].id; state.offset = 0; }
    populateSongs();
    render();
    setSourceStatus('No pude leer la Google Sheet central todavía. Estoy usando la copia local incluida. Para activar la base central: en Google Sheets, Archivo → Compartir → Publicar en la web, pestaña Songs.', false);
  });
window.addEventListener('resize', render);
el.songSelect.addEventListener('change', e => { state.songId = e.target.value; state.offset = 0; render(); });
el.keySelect.addEventListener('change', e => { const song=currentSong(); state.offset = keyIndex(e.target.value) - keyIndex(song.key); render(); });
document.getElementById('downBtn').addEventListener('click', ()=>{ state.offset -= 1; render(); });
document.getElementById('upBtn').addEventListener('click', ()=>{ state.offset += 1; render(); });
document.getElementById('resetBtn').addEventListener('click', ()=>{ state.offset = 0; render(); });
document.getElementById('fontDown').addEventListener('click', ()=>{ state.fontSize = Math.max(12, state.fontSize - 1); render(); });
document.getElementById('fontUp').addEventListener('click', ()=>{ state.fontSize = Math.min(24, state.fontSize + 1); render(); });
