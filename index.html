<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cancionero transpositor</title>
  <style>
    :root{
      --bg:#050505;
      --panel:#121212;
      --panel-soft:#1a1a1a;
      --ink:#ffffff;
      --muted:#b8b8b8;
      --line:#2b2b2b;
      --accent:#1ed760;
      --accent-strong:#3df07a;
      --accent-wash:rgba(30,215,96,.14);
      --danger:rgba(255,125,125,.14);
      --warn:rgba(255,193,102,.15);
      --font-size:15px;
      --radius:16px;
      --radius-pill:999px;
      --shadow:0 20px 44px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      color:var(--ink);
      font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
      background:
        radial-gradient(circle at top left, rgba(30,215,96,.17), transparent 26%),
        radial-gradient(circle at top right, rgba(65,65,65,.6), transparent 24%),
        linear-gradient(180deg, #0a0a0a 0%, #000 100%);
    }
    header{padding:0 0 8px}
    .bar{
      max-width:1180px;
      margin:0 auto;
      display:grid;
      gap:10px;
    }
    .brand{
      width:100%;
      padding:14px 16px 12px;
      background:rgba(18,18,18,.96);
      border-top:1px solid rgba(255,255,255,.06);
      border-bottom:1px solid rgba(255,255,255,.08);
      box-shadow:0 10px 24px rgba(0,0,0,.22);
    }
    h1{
      margin:0;
      font-size:26px;
      line-height:.96;
      letter-spacing:-.04em;
      font-weight:800;
    }
    .app-subtitle{display:none}
    .controls{
      display:grid;
      grid-template-columns:1fr;
      gap:8px;
      padding:0 12px;
    }
    .config-row{
      display:grid;
      grid-template-columns:minmax(92px,1.1fr) minmax(132px,1fr) minmax(108px,.9fr);
      gap:6px;
      align-items:end;
    }
    .wide{grid-column:1 / -1}
    label{
      display:block;
      margin:0 0 5px;
      font-size:10px;
      font-weight:700;
      color:#8c8c8c;
      text-transform:uppercase;
      letter-spacing:.12em;
    }
    select,button,input,textarea{
      width:100%;
      min-height:40px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:var(--radius-pill);
      background:#242424;
      color:var(--ink);
      padding:7px 11px;
      font-size:12px;
      transition:transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }
    input,textarea{font-family:inherit}
    textarea{
      min-height:300px;
      padding:12px 14px;
      line-height:1.45;
      border-radius:14px;
      resize:vertical;
    }
    select:focus,button:focus,input:focus,textarea:focus{
      outline:none;
      border-color:rgba(30,215,96,.68);
      box-shadow:0 0 0 3px rgba(30,215,96,.16);
    }
    button{
      font-weight:700;
      background:#2a2a2a;
      cursor:pointer;
    }
    button:hover{transform:translateY(-1px);background:#313131}
    button:disabled,input:disabled,textarea:disabled,select:disabled{
      opacity:.58;
      cursor:not-allowed;
      transform:none;
    }
    .stepper{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
    .stepper.two{grid-template-columns:1fr 1fr}
    .stepper button{min-height:38px;padding:7px 0}
    #resetBtn,#fontUp,.primary-btn{
      background:var(--accent);
      color:#08120b;
      border-color:transparent;
    }
    #resetBtn:hover,#fontUp:hover,.primary-btn:hover{background:var(--accent-strong)}
    main{
      max-width:1180px;
      margin:0 auto;
      padding:4px 12px 20px;
    }
    .sheet{
      position:relative;
      overflow:hidden;
      background:rgba(18,18,18,1);
      border:1px solid rgba(255,255,255,.06);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:14px 12px 20px;
    }
    .song-head{
      display:grid;
      gap:12px;
      padding:8px 0 14px;
      margin-bottom:14px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .song-title{
      margin:0;
      font-size:clamp(28px, 8vw, 64px);
      line-height:.94;
      letter-spacing:-.05em;
      font-weight:900;
      max-width:13ch;
    }
    .song-toolbar{display:grid;gap:12px}
    .meta,.song-actions,.editor-actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      min-height:30px;
      padding:5px 10px;
      border:1px solid rgba(255,255,255,.07);
      border-radius:var(--radius-pill);
      background:rgba(255,255,255,.05);
      font-size:12px;
      color:#f3f3f3;
    }
    .status-badge{
      border-color:rgba(30,215,96,.22);
      background:var(--accent-wash);
      color:#dbffe7;
    }
    .status-badge.warn{border-color:rgba(255,193,102,.22);background:var(--warn);color:#ffe6bb}
    .status-badge.error{border-color:rgba(255,125,125,.22);background:var(--danger);color:#ffd6d6}
    .ghost-btn{width:auto;min-width:120px;padding:9px 14px;background:rgba(255,255,255,.05)}
    .ghost-btn.active{background:var(--accent);color:#08120b;border-color:transparent}
    .reference-player{
      margin:0 0 16px;
      border:1px solid rgba(255,255,255,.06);
      border-radius:14px;
      background:rgba(255,255,255,.04);
      overflow:hidden;
    }
    .reference-toggle{
      list-style:none;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:11px 12px;
      cursor:pointer;
    }
    .reference-toggle::-webkit-details-marker{display:none}
    .reference-summary,.reference-actions{
      display:flex;
      align-items:center;
      gap:8px;
    }
    .reference-icon{width:28px;height:20px;flex:0 0 28px;display:block}
    .reference-chevron{color:var(--muted);font-size:14px;transition:transform .18s ease}
    .reference-player[open] .reference-chevron{transform:rotate(180deg)}
    .reference-body{padding:0 12px 12px;border-top:1px solid rgba(255,255,255,.06)}
    .reference-frame{display:block;width:100%;aspect-ratio:16/9;min-height:200px;border:0;border-radius:12px}
    .editor-modal{
      position:fixed;
      inset:0;
      z-index:40;
      display:grid;
      place-items:end center;
      padding:16px 12px;
      background:rgba(0,0,0,.62);
      backdrop-filter:blur(8px);
    }
    .editor-modal[hidden]{
      display:none !important;
    }
    .editor-panel{
      width:min(820px, 100%);
      max-height:min(90vh, 920px);
      overflow:auto;
      display:grid;
      gap:12px;
      padding:16px;
      border:1px solid rgba(255,255,255,.07);
      border-radius:18px;
      background:linear-gradient(180deg, rgba(30,30,30,.98), rgba(18,18,18,.98));
      box-shadow:0 24px 50px rgba(0,0,0,.42);
    }
    .editor-modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .editor-modal-head h3{
      margin:0;
      font-size:18px;
      letter-spacing:-.02em;
    }
    .icon-btn{
      width:40px;
      min-width:40px;
      min-height:40px;
      padding:0;
      font-size:20px;
      line-height:1;
      border-radius:999px;
    }
    .editor-grid{
      display:grid;
      gap:10px;
      grid-template-columns:repeat(2, minmax(0,1fr));
    }
    .editor-grid .full{grid-column:1 / -1}
    .editor-panel label{margin-bottom:6px;color:#bdbdbd}
    .editor-status{min-height:22px;font-size:12px;line-height:1.4;color:#d8d8d8}
    .editor-status.warn{color:#ffe0a3}
    .editor-status.error{color:#ffb7b7}
    #songBody{
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
      font-size:var(--font-size);
      line-height:1.2;
      color:#f6f6f6;
      font-variant-ligatures:none;
      text-rendering:optimizeSpeed;
    }
    .section{
      margin:18px 0 8px;
      padding-top:10px;
      border-top:1px solid rgba(255,255,255,.08);
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      font-size:11px;
      font-weight:800;
      color:#d1d1d1;
      text-transform:uppercase;
      letter-spacing:.11em;
    }
    .comment{
      margin:4px 0 6px;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      font-size:11px;
      font-style:italic;
      color:#909090;
    }
    .empty{height:8px}
    .pair{margin:2px 0 6px;padding:1px 0}
    .pair .chords,.pair .lyrics,.chord-row,.plain-row{
      white-space:pre;
      overflow:hidden;
      font-family:inherit;
      max-width:100%;
    }
    .pair .chords,.chord-row{
      color:var(--accent);
      font-weight:800;
      min-height:1.08em;
      text-shadow:0 0 10px rgba(30,215,96,.12);
    }
    .pair .lyrics,.plain-row{color:#efefef}
    .line-style-1 .lyrics,.plain-row.line-style-1{color:#f6f1c2}
    .line-style-2 .lyrics,.plain-row.line-style-2{color:#cfe8ff}
    .line-style-3 .lyrics,.plain-row.line-style-3{color:#ffd7c2}
    .plain-row{padding:1px 0}
    .note{
      margin-top:14px;
      padding:10px 11px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      background:rgba(255,255,255,.04);
      color:var(--muted);
      font-size:11px;
      line-height:1.45;
    }
    .page-advance{
      position:fixed;
      right:16px;
      bottom:16px;
      width:70px;
      height:70px;
      border-radius:999px;
      border:0;
      background:linear-gradient(180deg, var(--accent-strong), var(--accent));
      color:#07110a;
      font-size:28px;
      font-weight:900;
      box-shadow:0 18px 30px rgba(0,0,0,.38);
      z-index:30;
    }
    .page-advance[hidden]{display:none}
    body.modal-open{
      overflow:hidden;
      touch-action:none;
    }
    @media (min-width:700px){
      header{padding:14px 18px 8px}
      .brand{padding:0;background:transparent;border:0;box-shadow:none}
      .bar{gap:12px}
      .controls{gap:10px;padding:0}
      main{padding:6px 18px 28px}
      .sheet{padding:22px 24px 28px}
      .song-head{padding:14px 0 16px;margin-bottom:16px}
      .song-toolbar{grid-template-columns:minmax(0,1fr) auto;align-items:end}
    }
    @media (min-width:980px){
      .bar{grid-template-columns:minmax(280px,1.3fr) minmax(520px,2fr);align-items:end}
    }
    @media (max-width:699px){
      .editor-grid{grid-template-columns:1fr}
      .page-advance{width:64px;height:64px;right:12px;bottom:12px}
    }
    @media print{
      header,.note,.reference-player,.editor-modal,.page-advance{display:none}
      body{background:white}
      main{padding:0;max-width:none}
      .sheet{border:0;box-shadow:none;border-radius:0}
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand">
        <h1>Cancionero transpositor</h1>
        <p class="app-subtitle">Modo cancionero en vivo, con transposición instantánea y estética tipo streaming.</p>
      </div>
      <div class="controls">
        <div class="wide">
          <label for="songSelect">Canción</label>
          <select id="songSelect"></select>
        </div>
        <div>
          <label for="keySelect">Tono</label>
          <select id="keySelect"></select>
        </div>
        <div>
          <label>Transponer</label>
          <div class="stepper">
            <button id="downBtn" type="button">−1</button>
            <button id="resetBtn" type="button">0</button>
            <button id="upBtn" type="button">+1</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <article class="sheet" id="sheet">
      <div class="song-head">
        <h2 class="song-title" id="songTitle"></h2>
        <div class="song-toolbar">
          <div class="meta">
            <span class="badge" id="originalKey"></span>
            <span class="badge" id="currentKey"></span>
            <span class="badge" id="semitones"></span>
          </div>
          <div class="song-actions">
            <button id="loginEditBtn" class="ghost-btn" type="button">Login para editar</button>
            <button id="toggleEditBtn" class="ghost-btn" type="button">Editar</button>
            <span class="badge status-badge" id="connectionStatus">Modo lectura</span>
          </div>
        </div>
      </div>

      <div id="songReference"></div>

      <div id="songBody"></div>

      <div class="footer-actions">
        <button id="fontDown" type="button">Letra −</button>
        <button id="fontUp" type="button">Letra +</button>
      </div>
      <div class="note">Cargando canciones desde Google Sheet central... Si la hoja todavía no está publicada, se usa una copia local de respaldo.</div>
    </article>
  </main>

  <button id="pageAdvanceBtn" class="page-advance" type="button" aria-label="Pasar hoja">↓</button>
  <div class="editor-modal" id="editorModal" hidden>
    <section class="editor-panel" id="editorPanel" role="dialog" aria-modal="true" aria-labelledby="editorModalTitle">
      <div class="editor-modal-head">
        <h3 id="editorModalTitle">Editar canción</h3>
        <button id="closeEditorBtn" class="icon-btn" type="button" aria-label="Cerrar editor">×</button>
      </div>
      <div class="editor-status" id="editorStatus"></div>
      <div class="editor-grid">
        <div>
          <label for="editTitle">Título</label>
          <input id="editTitle" type="text" autocomplete="off" />
        </div>
        <div>
          <label for="editKey">Tono base</label>
          <input id="editKey" type="text" autocomplete="off" placeholder="Ej: Am, G, F#m" />
        </div>
        <div class="full">
          <label for="editYoutubeUrl">YouTube URL</label>
          <input id="editYoutubeUrl" type="url" autocomplete="off" placeholder="https://www.youtube.com/watch?v=..." />
        </div>
        <div class="full">
          <label for="editBody">Texto crudo</label>
          <textarea id="editBody" spellcheck="false"></textarea>
        </div>
      </div>
      <div class="editor-actions">
        <button id="saveSongBtn" class="primary-btn" type="button">Guardar cambios</button>
        <button id="reloadSongBtn" type="button">Recargar desde la hoja</button>
        <button id="cancelEditBtn" type="button">Cancelar</button>
      </div>
    </section>
  </div>

<script>
const SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const NOTE_TO_INDEX = {
  'C':0,'B#':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'Fb':4,
  'E#':5,'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11,'Cb':11
};
const MAJOR_KEYS = SHARP.concat(FLAT.filter(key => !SHARP.includes(key)));
const MINOR_KEYS = MAJOR_KEYS.map(key => `${key}m`);
const SHEET_ID = '1ODcMNnguu-pHW6BK7zbOGSMRYkgwQiDac5YPsjS7Smc';
const SHEET_NAME = 'Songs';
const APPS_SCRIPT_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbwZLg6JiqjFKyQpaC51HQrgitRz5Qwzkdd_D-h5Ln0-fM_5_8x1t9Vk0hhYY_5cNrNkMg/exec';
const PAGE_OVERLAP_PX = 88;
const SONGS_CACHE_KEY = 'songs.cache.v2';
const API_URL_STORAGE_KEY = 'songbook.apiUrl';

function parseKey(key) {
  const match = String(key || '').match(/^([A-G](?:#|b)?)(m?)$/);
  return { root: match ? match[1] : 'C', minor: !!(match && match[2]) };
}
function keyIndex(key) { return NOTE_TO_INDEX[parseKey(key).root]; }
function transposeRoot(root, offset, preferFlats) {
  const idx = NOTE_TO_INDEX[root];
  if (idx === undefined) return root;
  const scale = preferFlats ? FLAT : SHARP;
  return scale[(idx + offset + 1200) % 12];
}
function transposeChord(chord, offset, preferFlats) {
  if (!chord || !chord.trim()) return chord;
  return chord.replace(/([A-G](?:#|b)?)/g, (_, root) => transposeRoot(root, offset, preferFlats));
}
function normalizeOffset(value) {
  let normalized = ((value % 12) + 12) % 12;
  if (normalized > 6) normalized -= 12;
  return normalized;
}
function targetKeyName(song, offset, preferFlats) {
  const parsed = parseKey(song.key);
  return `${transposeRoot(parsed.root, offset, preferFlats)}${parsed.minor ? 'm' : ''}`;
}
function decodeMojibake(value) {
  const text = String(value == null ? '' : value);
  if (!/[Ãâ]/.test(text)) return text;
  try {
    const bytes = Uint8Array.from(text, char => char.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  } catch (err) {
    return text;
  }
}
function sanitizeSong(song, fallbackIndex) {
  if (!song) return null;
  const title = decodeMojibake(String(song.title || '').trim());
  const key = decodeMojibake(String(song.key || '').trim());
  const body = decodeMojibake(String(song.body || '')).replace(/\r\n/g, '\n').trim();
  const youtubeUrl = decodeMojibake(String(song.youtubeUrl || '').trim());
  let id = String(song.id || title || '').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  if (!id && typeof fallbackIndex === 'number') id = `song-${fallbackIndex + 1}`;
  if (!title || !key || !body || !id) return null;
  return { id, title, key, body, youtubeUrl };
}
function parseSongsPayload(payload) {
  return (Array.isArray(payload) ? payload : []).map((song, index) => sanitizeSong(song, index)).filter(Boolean);
}
function cloneSong(song) {
  return song ? { id: song.id, title: song.title, key: song.key, body: song.body, youtubeUrl: song.youtubeUrl || '' } : null;
}
function songsEqual(a, b) {
  return !!a && !!b &&
    a.id === b.id &&
    a.title === b.title &&
    a.key === b.key &&
    a.body === b.body &&
    (a.youtubeUrl || '') === (b.youtubeUrl || '');
}
function normalizeApiUrl(url) {
  const value = String(url || '').trim();
  if (!value || value.includes('REPLACE_WITH_DEPLOYMENT_ID')) return '';
  return value;
}
function getConfiguredApiUrl() {
  const fromQuery = new URLSearchParams(window.location.search).get('api');
  if (fromQuery) {
    localStorage.setItem(API_URL_STORAGE_KEY, fromQuery);
    return normalizeApiUrl(fromQuery);
  }
  return normalizeApiUrl(localStorage.getItem(API_URL_STORAGE_KEY) || APPS_SCRIPT_URL_DEFAULT);
}
function hasConfiguredApi() { return !!getConfiguredApiUrl(); }
function parseApiResponseText(text) {
  if (!text) return {};
  try { return JSON.parse(text); }
  catch (err) { throw new Error(text.trim() || 'Respuesta inválida del servidor.'); }
}
async function callApi(action, options = {}) {
  const baseUrl = getConfiguredApiUrl();
  if (!baseUrl) throw new Error('Configurá la URL de la Web App de Apps Script para habilitar la edición protegida.');
  const method = (options.method || 'GET').toUpperCase();
  const url = new URL(baseUrl);
  const init = { method, credentials: 'include' };
  if (method === 'GET') {
    url.searchParams.set('action', action);
    url.searchParams.set('_', Date.now().toString());
  } else {
    init.headers = { 'Content-Type': 'application/json' };
    init.body = JSON.stringify({ action, ...(options.payload || {}) });
  }
  const response = await fetch(url.toString(), init);
  const text = await response.text();
  const data = parseApiResponseText(text);
  if (!response.ok || data.ok === false) throw new Error(data.error || `Error ${response.status} al comunicarme con la Web App.`);
  return data;
}
function loadSongsFromGoogleSheet() {
  return new Promise((resolve, reject) => {
    const callbackName = `__cancionero_cb_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
    const src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&tqx=out:json;responseHandler:${callbackName}`;
    const script = document.createElement('script');
    let done = false;
    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('No se pudo leer la Google Sheet pública.'));
    }, 7000);
    function cleanup() {
      clearTimeout(timer);
      try { delete window[callbackName]; } catch (err) { window[callbackName] = undefined; }
      script.remove();
    }
    window[callbackName] = (res) => {
      if (done) return;
      done = true;
      cleanup();
      try { resolve(parseGvizSongs(res)); } catch (err) { reject(err); }
    };
    script.onerror = () => {
      if (done) return;
      done = true;
      cleanup();
      reject(new Error('Error cargando la fuente pública de canciones.'));
    };
    script.src = src;
    document.head.appendChild(script);
  });
}
function parseGvizSongs(res) {
  if (!res || !res.table || !res.table.cols || !res.table.rows) return [];
  const headers = res.table.cols.map((column, index) => String(column.label || column.id || `col${index}`).trim().toLowerCase());
  const headerIndex = name => headers.indexOf(name);
  const idx = {
    id: headerIndex('id'),
    title: headerIndex('title'),
    key: headerIndex('key'),
    body: headerIndex('body'),
    visible: headerIndex('visible'),
    youtubeUrl: headerIndex('youtubeurl')
  };
  if (idx.title < 0 || idx.key < 0 || idx.body < 0) return [];
  return res.table.rows.map((row, rowIndex) => {
    const cells = row.c || [];
    const get = column => column >= 0 && cells[column] ? (cells[column].v ?? '') : '';
    const visible = String(get(idx.visible) || 'TRUE').toUpperCase();

  div.textContent = parts.join('  ');
  return div;
}
function renderPlainWrapped(text, lyricsStyle) {
  const chunks = wrapLyric(text, getMaxCols());
  const fragment = document.createDocumentFragment();
  chunks.forEach(({ start, end }) => {
    const div = document.createElement('div');
    div.className = 'plain-row';
    applyLyricsStyleClass(div, lyricsStyle);
    div.textContent = text.slice(start, end).trimEnd();
    fragment.appendChild(div);
  });
  return fragment;
}
function renderLine(line, offset, preferFlats, lyricsStyle) {
  if (!line.trim()) {
    const div = document.createElement('div');
    div.className = 'empty';
    return div;
  }
  const section = line.match(/^\{section:\s*(.*?)\}$/);
  if (section) {
    const div = document.createElement('div');
    div.className = 'section';
    div.textContent = section[1];
    return div;
  }
  const comment = line.match(/^\{comment:\s*(.*?)\}$/);
  if (comment) {
    const div = document.createElement('div');
    div.className = 'comment';
    div.textContent = comment[1];
    return div;
  }
  if (/^\{chords:/.test(line)) return renderChordOnly(line, offset, preferFlats);
  if (!line.includes('[')) {
    const box = document.createElement('div');
    box.appendChild(renderPlainWrapped(line, lyricsStyle));
    return box;
  }
  const { lyric, placements } = parseBracketLine(line);
  const chunks = wrapLyric(lyric, getMaxCols());
  const box = document.createElement('div');
  chunks.forEach(({ start, end }) => {
    const lyricChunk = lyric.slice(start, end).trimEnd();
    const chordLine = buildChordLine(lyricChunk.length, placements, start, end, offset, preferFlats);
    box.appendChild(renderPair(chordLine, lyricChunk, lyricsStyle));
  });
  return box;
}
function getYouTubeEmbedUrl(url) {
  if (!url) return '';
  try {
    const parsedUrl = new URL(url);
    const host = parsedUrl.hostname.replace(/^www\./, '').toLowerCase();
    let videoId = '';
    if (host === 'youtu.be') videoId = parsedUrl.pathname.split('/').filter(Boolean)[0] || '';
    else if (host === 'youtube.com' || host === 'm.youtube.com') {
      if (parsedUrl.pathname === '/watch') videoId = parsedUrl.searchParams.get('v') || '';
      else if (parsedUrl.pathname.startsWith('/embed/')) videoId = parsedUrl.pathname.split('/').filter(Boolean)[1] || '';
      else if (parsedUrl.pathname.startsWith('/shorts/')) videoId = parsedUrl.pathname.split('/').filter(Boolean)[1] || '';
    }
    if (!/^[a-zA-Z0-9_-]{11}$/.test(videoId)) return '';
    return `https://www.youtube.com/embed/${videoId}`;
  } catch (err) {
    return '';
  }
}
function renderYouTubeReference(song) {

  iframe.loading = 'lazy';

function syncDraftToForm() {
  const draft = state.draftSong || cloneSong(currentSong());
  if (!draft) return;
  el.editTitle.value = draft.title || '';
  el.editKey.value = draft.key || '';
  el.editYoutubeUrl.value = draft.youtubeUrl || '';

}
function syncFormToDraft() {
  if (!state.draftSong) state.draftSong = cloneSong(currentSong());
  if (!state.draftSong) return;
  state.draftSong.title = el.editTitle.value.trim();
  state.draftSong.key = el.editKey.value.trim();
  state.draftSong.youtubeUrl = el.editYoutubeUrl.value.trim();
  state.draftSong.body = el.editBody.value.replace(/\r\n/g, '\n');
}
function hasDraftChanges() {
  syncFormToDraft();
  return !songsEqual(state.draftSong, currentSong());
}
function renderEditorState() {
  el.editorModal.hidden = !state.isEditing;
  document.body.classList.toggle('modal-open', state.isEditing);
  el.pageAdvanceBtn.hidden = state.isEditing;
  const showLogin = state.apiEnabled && !state.canEdit && !state.isEditing;
  const showEdit = state.apiEnabled && state.canEdit && !state.isCheckingPermissions;
  el.loginEditBtn.hidden = !showLogin;
  el.loginEditBtn.disabled = state.isCheckingPermissions;
  el.loginEditBtn.textContent = state.isCheckingPermissions ? 'Verificando...' : 'Login para editar';
  el.toggleEditBtn.hidden = !showEdit;
  el.toggleEditBtn.classList.toggle('active', state.isEditing);
  el.toggleEditBtn.textContent = state.isEditing ? 'Editando...' : 'Editar';
  const locked = !state.canEdit || state.isSaving || state.isCheckingPermissions;
  [el.editTitle, el.editKey, el.editYoutubeUrl, el.editBody].forEach(node => {
    node.readOnly = locked;
    node.disabled = false;
  });
  el.saveSongBtn.disabled = locked;
  el.reloadSongBtn.disabled = state.isSaving;
  el.cancelEditBtn.disabled = state.isSaving;
  let message = state.editorMessage;
  let tone = state.editorTone;
  if (state.isEditing && state.isCheckingPermissions) {
    message = 'Verificando permisos de edición...';
    tone = '';
  } else if (state.isEditing && !state.canEdit) {
    message = state.apiEnabled ? 'Iniciá sesión con una cuenta de Google que tenga permiso de edición sobre la hoja.' : 'Configurá la Web App de Apps Script para habilitar la edición protegida.';
    tone = 'warn';
  } else if (state.isEditing && state.canEdit && !message) {
    message = state.currentUserEmail ? `Editando como ${state.currentUserEmail}.` : 'Edición habilitada.';
    tone = '';
  }
  el.editorStatus.textContent = message || '';
  el.editorStatus.className = 'editor-status';
  if (tone) el.editorStatus.classList.add(tone);
}
function renderSongBody(song) {
  const preferFlats = song.key.includes('b') || targetKeyName(song, state.offset, false).includes('b');
  const currentKey = targetKeyName(song, state.offset, preferFlats);
  document.documentElement.style.setProperty('--font-size', `${state.fontSize}px`);
  populateKeys();
  el.songSelect.value = song.id;
  el.songTitle.textContent = song.title;
  el.originalKey.textContent = `Original: ${song.key}`;
  el.currentKey.textContent = `Actual: ${currentKey}`;
  const offset = normalizeOffset(state.offset);
  el.semitones.textContent = offset === 0 ? 'Sin transponer' : (offset > 0 ? `+${offset} semitonos` : `${offset} semitonos`);
  renderYouTubeReference(song);
  el.body.hidden = false;
  el.body.innerHTML = '';
  let lyricsStyle = '';
  song.body.split('\n').forEach(line => {
    const styleDirective = line.match(/^\{lyrics-style:\s*(.*?)\}$/i);
    if (styleDirective) {
      lyricsStyle = normalizeLyricsStyleToken(styleDirective[1]);
      return;
    }
    el.body.appendChild(renderLine(line, state.offset, preferFlats, lyricsStyle));
  });
}
function render() {
  const song = currentSong();
  if (!song) return;
  populateSongs();
  renderSongBody(song);
  renderEditorState();
  saveLocalState();
  setControlsDisabled(state.isEditing);
}
async function fetchSongsFromApi() {
  const response = await callApi('list');
  return parseSongsPayload(response.songs);
}
async function fetchEditorStatus() {
  const response = await callApi('editor-status');
  return { canEdit: !!response.canEdit, currentUserEmail: String(response.currentUserEmail || '').trim() };
}
async function saveSongToApi(song) {
  const response = await callApi('update', { method: 'POST', payload: { song } });
  return sanitizeSong(response.song || song);
}
async function refreshEditorStatus() {
  if (!state.apiEnabled) {
    state.canEdit = false;
    state.currentUserEmail = '';
    setConnectionStatus('Edición sin configurar', 'warn');
    renderEditorState();
    return;
  }
  state.isCheckingPermissions = true;
  renderEditorState();
  try {
    const status = await fetchEditorStatus();
    state.canEdit = status.canEdit;
    state.currentUserEmail = status.currentUserEmail;
    if (state.canEdit) setConnectionStatus(status.currentUserEmail ? `Editor: ${status.currentUserEmail}` : 'Conectado', '');
    else setConnectionStatus('Sin permiso de edición', 'warn');
  } catch (err) {
    console.warn(err);
    state.canEdit = false;
    state.currentUserEmail = '';
    setConnectionStatus('Error de autenticación', 'error');
    state.editorMessage = err.message;
    state.editorTone = 'error';
  } finally {
    state.isCheckingPermissions = false;
    renderEditorState();
  }
}
async function enterEditMode() {
  if (!state.canEdit) {
    await refreshEditorStatus();
    if (!state.canEdit) return;
  }
  state.isEditing = true;
  state.draftSong = cloneSong(currentSong());
  state.editorMessage = '';
  state.editorTone = '';
  syncDraftToForm();
  render();
  if (state.canEdit) {
    setTimeout(() => el.editBody.focus({ preventScroll: true }), 0);
  }
}
function leaveEditMode(forceDiscard) {
  if (!state.isEditing) return;
  if (!forceDiscard && hasDraftChanges()) {
    const discard = window.confirm('Hay cambios sin guardar. ¿Querés descartarlos?');
    if (!discard) return;
  }
  state.isEditing = false;
  state.draftSong = null;
  state.editorMessage = '';
  state.editorTone = '';
  render();
  el.toggleEditBtn.focus({ preventScroll: true });
}
async function reloadCurrentSongFromRemote() {
  if (state.isSaving) return;
  state.editorMessage = 'Recargando canción desde la hoja...';
  state.editorTone = '';
  renderEditorState();
  try {
    let remoteSongs = [];
    if (state.apiEnabled) remoteSongs = await fetchSongsFromApi();
    if (!remoteSongs.length) remoteSongs = await loadSongsFromGoogleSheet();
    if (!remoteSongs.length) throw new Error('No pude recuperar canciones desde la hoja.');
    setSongs(remoteSongs, state.apiEnabled ? 'api' : 'remote');
    saveSongsCache(songs);
    state.draftSong = cloneSong(currentSong());
    syncDraftToForm();
    state.editorMessage = 'Canción recargada desde la hoja.';
    state.editorTone = '';
    render();
  } catch (err) {
    console.warn(err);
    state.editorMessage = err.message || 'No pude recargar la canción.';
    state.editorTone = 'error';
    renderEditorState();
  }
}
async function saveCurrentSong() {
  if (state.isSaving) return;
  syncFormToDraft();
  const draft = state.draftSong;
  if (!draft) return;
  if (!draft.title || !draft.key || !draft.body.trim()) {
    state.editorMessage = 'Título, tono y texto crudo son obligatorios.';
    state.editorTone = 'error';
    renderEditorState();
    return;
  }
  if (!state.apiEnabled) {
    state.editorMessage = 'Configurá la Web App de Apps Script antes de guardar.';
    state.editorTone = 'error';
    renderEditorState();
    return;
  }
  state.isSaving = true;
  state.editorMessage = 'Guardando...';
  state.editorTone = '';
  renderEditorState();
  try {
    const savedSong = await saveSongToApi(draft);
    const nextSongs = songs.map(song => song.id === savedSong.id ? savedSong : song);
    setSongs(nextSongs, 'api');
    saveSongsCache(songs);
    state.songId = savedSong.id;
    state.isEditing = false;
    state.draftSong = null;
    state.editorMessage = '';
    state.editorTone = '';
    render();
    setSourceStatus('Cambios guardados en Google Sheets y copia local actualizada.', 'ok');
    setConnectionStatus(state.currentUserEmail ? `Guardado como ${state.currentUserEmail}` : 'Guardado', '');
  } catch (err) {
    console.warn(err);
    state.editorMessage = err.message || 'Error al guardar.';
    state.editorTone = 'error';
    renderEditorState();
    setConnectionStatus('Error al guardar', 'error');
  } finally {
    state.isSaving = false;
    renderEditorState();
  }
}
function scrollByPage(direction) {
  const delta = Math.max(180, window.innerHeight - PAGE_OVERLAP_PX) * direction;
  window.scrollBy({ top: delta, behavior: 'smooth' });
}
function isTypingTarget(target) {
  if (!target) return false;
  const tagName = target.tagName;
  return tagName === 'INPUT' || tagName === 'TEXTAREA' || tagName === 'SELECT' || target.isContentEditable;
}

groupHeaderControls();
populateSongs();
render();
if (currentSongsSource === 'cache') {
  const cachedAt = formatCachedAt(cachedSongsMeta && cachedSongsMeta.savedAt);
  setSourceStatus(`Mostrando la copia guardada localmente mientras intento sincronizar.${cachedAt ? ` Última sincronización: ${cachedAt}.` : ''}`, 'ok');
} else {

}
if (state.apiEnabled) {

} else {

}
(async () => {
  try {
    let remoteSongs = [];
    if (state.apiEnabled) {
      try { remoteSongs = await fetchSongsFromApi(); }
      catch (apiError) { console.warn('No pude leer canciones desde Apps Script, pruebo fuente pública.', apiError); }
    }
    if (!remoteSongs.length) remoteSongs = await loadSongsFromGoogleSheet();
    if (!remoteSongs.length) throw new Error('No encontré canciones válidas en la hoja.');
    setSongs(remoteSongs, state.apiEnabled && remoteSongs.length ? 'api' : 'remote');
    saveSongsCache(songs);
    render();
    setSourceStatus('Fuente central cargada correctamente. Guardé una copia local para usarla sin conexión si hace falta.', 'ok');
  } catch (err) {
    console.warn(err);
    if (currentSongsSource === 'cache') {
      const cachedAt = formatCachedAt(cachedSongsMeta && cachedSongsMeta.savedAt);
      setSourceStatus(`No pude leer la fuente central. Sigo usando la copia local guardada.${cachedAt ? ` Última sincronización: ${cachedAt}.` : ''}`, 'warn');
      return;
    }
    setSongs(EMBEDDED_SONGS, 'embedded');
    render();
    setSourceStatus('No pude leer la fuente central todavía. Estoy usando la copia local incluida en este archivo.', 'warn');
  }
})();
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 120);
});
el.songSelect.addEventListener('change', event => {
